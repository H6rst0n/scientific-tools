<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AtomCraft 3D Test Suite</title>
  <script>
    window.errs = [];
    window.onerror = function(msg, url, lineNo, colNo, error) {
      window.errs.push(`${msg} in ${url}:${lineNo}`);
      var el = document.getElementById('test-results');
      if (el) el.textContent += `ERR: ${msg} in ${url} at ${lineNo}\n`;
    };
  </script>
</head>
<body>
  <h1>AtomCraft 3D Automated Verification Test Suite</h1>
  <pre id="test-results"></pre>

  <script src="lib/three.min.js"></script>
  <script src="lib/OrbitControls.js"></script>
  <script src="js/elements.js"></script>
  <script src="js/periodic_table.js"></script>
  <script src="js/structure.js"></script>
  <script src="js/vsepr.js"></script>
  <script src="js/crystal.js"></script>
  <script src="js/adjust_geometry.js"></script>
  <script src="js/parsers.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/controls.js"></script>

  <script>
    const log = (msg) => {
      console.log(msg);
      document.getElementById('test-results').textContent += msg + '\n';
    };

    let passed = 0;
    let failed = 0;

    function assert(cond, name) {
      if (cond) {
        passed++;
        log(`[PASS] ${name}`);
      } else {
        failed++;
        log(`[FAIL] ${name}`);
      }
    }

    function assertNear(actual, expected, tol, name) {
      const diff = Math.abs(actual - expected);
      if (diff <= tol) {
        passed++;
        log(`[PASS] ${name} (actual: ${actual.toFixed(4)}, expected: ${expected.toFixed(4)}, diff: ${diff.toFixed(6)})`);
      } else {
        failed++;
        log(`[FAIL] ${name} (actual: ${actual.toFixed(4)}, expected: ${expected.toFixed(4)}, diff: ${diff.toFixed(6)} > ${tol})`);
      }
    }

    try {
      log('=== 1. Structure & Fractional Math Test ===');
      const s = new Structure();
      s.setCellParameters(5.0, 6.0, 7.0, 90, 90, 90);
      const params = s.getCellParameters();
      assertNear(params.volume, 210.0, 1e-4, 'Lattice volume calculation');
      
      const cart = s.fractionalToCartesian(0.5, 0.5, 0.5);
      assertNear(cart[0], 2.5, 1e-4, 'Fractional to Cartesian X');
      assertNear(cart[1], 3.0, 1e-4, 'Fractional to Cartesian Y');
      assertNear(cart[2], 3.5, 1e-4, 'Fractional to Cartesian Z');

      const frac = s.cartesianToFractional(2.5, 3.0, 3.5);
      assertNear(frac[0], 0.5, 1e-4, 'Cartesian to Fractional U');
      assertNear(frac[1], 0.5, 1e-4, 'Cartesian to Fractional V');
      assertNear(frac[2], 0.5, 1e-4, 'Cartesian to Fractional W');

      log('=== 2. VASP POSCAR Parser & Exporter Test ===');
      const poscarText = `Silicon Bulk
1.0
  5.4300000000   0.0000000000   0.0000000000
  0.0000000000   5.4300000000   0.0000000000
  0.0000000000   0.0000000000   5.4300000000
Si
2
Direct
  0.0000000000   0.0000000000   0.0000000000
  0.2500000000   0.2500000000   0.2500000000
`;
      const vaspStruct = Parsers.parseVASP(poscarText);
      assert(vaspStruct.atoms.length === 2, 'VASP loaded 2 atoms');
      assert(vaspStruct.cell !== null, 'VASP cell parsed');
      assertNear(vaspStruct.atoms[1].x, 5.43 * 0.25, 1e-4, 'VASP atom coordinate conversion');
      const exportedVasp = Parsers.exportVASP(vaspStruct, { direct: true });
      assert(exportedVasp.includes('Si'), 'VASP export contains species');
      assert(exportedVasp.includes('Direct'), 'VASP export is Direct mode');
      const exportedVaspCart = Parsers.exportVASP(vaspStruct, { direct: false });
      assert(exportedVaspCart.includes('Cartesian'), 'VASP export is Cartesian mode');
      assert(exportedVaspCart.includes('1.3575000000'), 'VASP Cartesian export contains Cartesian coordinate values in Å');

      log('=== 3. Gaussian GJF & ORCA INP Parser Test ===');
      const gjfText = `%chk=test.chk
#p b3lyp/6-31g* opt

Water Molecule

0 1
O   0.000000   0.000000   0.117000
H   0.000000   0.757000  -0.469000
H   0.000000  -0.757000  -0.469000

`;
      const gjfStruct = Parsers.parseGaussian(gjfText);
      assert(gjfStruct.atoms.length === 3, 'Gaussian loaded 3 atoms');
      assert(gjfStruct.charge === 0 && gjfStruct.multiplicity === 1, 'Gaussian charge/mult parsed');
      const orcaOut = Parsers.exportORCA(gjfStruct);
      assert(orcaOut.includes('* xyz 0 1'), 'ORCA exported xyz block');

      log('=== 4. VSEPR Clean 🧹 Algorithm Test ===');
      // 故意建立一個扭曲的水分子 (鍵長 2.5 Å, 夾角 60°)
      const badWater = new Structure();
      badWater.addAtom('O', 0, 0, 0);
      badWater.addAtom('H', 2.0, 0, 0); // 嚴重過長
      badWater.addAtom('H', 1.0, 1.732, 0); // 夾角 60度
      VSEPR.cleanGeometry(badWater, false);
      
      const d1 = Math.hypot(badWater.atoms[1].x - badWater.atoms[0].x, badWater.atoms[1].y - badWater.atoms[0].y, badWater.atoms[1].z - badWater.atoms[0].z);
      const idealOH = VSEPR.getIdealBondLength('O', 'H'); // ~0.97 Å
      assertNear(d1, idealOH, 0.15, 'VSEPR adjusted bond length towards ideal');
      
      const v1 = [badWater.atoms[1].x - badWater.atoms[0].x, badWater.atoms[1].y - badWater.atoms[0].y, badWater.atoms[1].z - badWater.atoms[0].z];
      const v2 = [badWater.atoms[2].x - badWater.atoms[0].x, badWater.atoms[2].y - badWater.atoms[0].y, badWater.atoms[2].z - badWater.atoms[0].z];
      const dot = v1[0]*v2[0] + v1[1]*v2[1] + v1[2]*v2[2];
      const l1 = Math.hypot(...v1);
      const l2 = Math.hypot(...v2);
      const angleDeg = Math.acos(dot / (l1 * l2)) * (180 / Math.PI);
      assert(angleDeg > 80 && angleDeg < 125, `VSEPR relaxed angle towards bent geometry (actual: ${angleDeg.toFixed(1)}°)`);

      log('=== 5. Crystal Supercell & Vacuum Test ===');
      const cry = new Structure();
      cry.setCellParameters(3.0, 3.0, 3.0, 90, 90, 90);
      cry.addAtom('C', 0, 0, 0);
      Crystal.expandSupercell(cry, 2, 2, 2);
      assert(cry.atoms.length === 8, 'Physical supercell expanded to 8 atoms');
      assertNear(cry.cell[0][0], 6.0, 1e-4, 'Expanded cell A vector doubled');
      
      Crystal.adjustVacuum(cry, 15.0);
      assertNear(cry.cell[2][2], 15.0 + 3.0, 1e-3, 'Z vacuum correctly added');

      log('=== 7. Lattice Box Orthogonality Test ===');
      const orthCell = [
        [5.0, 0.0, 0.0],
        [0.0, 6.0, 0.0],
        [0.0, 0.0, 7.0]
      ];
      const boxLines = Crystal.getLatticeBoxLines(orthCell);
      assert(boxLines.length === 12, 'Lattice box has exactly 12 edges');
      // 驗證頂點 p6 (頂面對角端點) 坐標為嚴格的 [5.0, 6.0, 7.0]
      const p6 = boxLines[5][1]; // edge [p5, p6]
      assertNear(p6[0], 5.0, 1e-4, 'p6 X coordinate is 5.0');
      assertNear(p6[1], 6.0, 1e-4, 'p6 Y coordinate is 6.0 (no skew!)');
      assertNear(p6[2], 7.0, 1e-4, 'p6 Z coordinate is 7.0');

      log('=== 8. Periodic Table & Hybridization Lookup Test ===');
      const cHybrids = getHybridizationsForElement('C');
      assert(cHybrids.some(h => h.id === 'sp3'), 'Carbon has sp3 tetrahedral');
      assert(cHybrids.some(h => h.id === 'sp2'), 'Carbon has sp2 planar');
      assert(cHybrids.some(h => h.id === 'sp'), 'Carbon has sp linear');

      const ptHybrids = getHybridizationsForElement('Pt');
      assert(ptHybrids.some(h => h.id === 'square_planar'), 'Platinum has square planar');
      assert(ptHybrids.some(h => h.id === 'octahedral'), 'Platinum has octahedral');

      log('=== 9. GaussView 1-2-3-4-5 Selection & Measurement Cycle Test ===');
      const dummyApp = {
        structure: new Structure(),
        renderer: {
          update: () => {},
          controls: { enabled: true },
          renderer: { domElement: document.createElement('div') },
          camera: new THREE.PerspectiveCamera(),
          pickAtom: () => -1
        },
        pushHistory: () => {},
        updateUI: () => {},
        updateStatus: () => {},
        setMeasurementDisplay: () => {},
        showToast: () => {},
        deactivateBrushMode: function(silent = false) {
          ctrl.isBrushMode = false;
          document.body.classList.remove('brush-mode-active');
        }
      };
      for (let i = 0; i < 6; i++) {
        dummyApp.structure.addAtom('C', i * 1.5, 0, 0);
      }
      const ctrl = new InteractionController(dummyApp);

      // 模擬點擊第 1 顆 (idx 0)
      dummyApp.renderer.pickAtom = () => 0;
      ctrl.handleClick({ clientX: 10, clientY: 10, button: 0 });
      assert(ctrl.selectedSequence.length === 1 && ctrl.selectedSequence[0] === 0, 'Click 1: Selected atom #1');

      // 模擬點擊第 2 顆 (idx 1)
      dummyApp.renderer.pickAtom = () => 1;
      ctrl.handleClick({ clientX: 20, clientY: 10, button: 0 });
      assert(ctrl.selectedSequence.length === 2 && ctrl.selectedSequence[1] === 1, 'Click 2: Selected atom #2');

      // 模擬點擊第 3 顆 (idx 2)
      dummyApp.renderer.pickAtom = () => 2;
      ctrl.handleClick({ clientX: 30, clientY: 10, button: 0 });
      assert(ctrl.selectedSequence.length === 3 && ctrl.selectedSequence[2] === 2, 'Click 3: Selected atom #3');

      // 模擬點擊第 4 顆 (idx 3)
      dummyApp.renderer.pickAtom = () => 3;
      ctrl.handleClick({ clientX: 40, clientY: 10, button: 0 });
      assert(ctrl.selectedSequence.length === 4 && ctrl.selectedSequence[3] === 3, 'Click 4: Selected atom #4');

      // 模擬點擊第 5 顆 (idx 4) -> 應自動取消前 4 顆，重新從第 1 顆 (idx 4) 開始！
      dummyApp.renderer.pickAtom = () => 4;
      ctrl.handleClick({ clientX: 50, clientY: 10, button: 0 });
      assert(ctrl.selectedSequence.length === 1 && ctrl.selectedSequence[0] === 4, 'Click 5: Reset previous 4 and restarted cycle at atom #5');
      log('=== 10. Geometry Adjuster (Bond, Angle, Dihedral) Test ===');
      const ethane = new Structure();
      ethane.addAtom('C', 0, 0, 0);
      ethane.addAtom('C', 1.54, 0, 0);
      ethane.addAtom('H', 2.0, 1.0, 0);
      ethane.detectBonds();

      // 測試鍵長調整
      const curBond = GeometryAdjuster.getBondLength(ethane, 0, 1);
      assertNear(curBond, 1.54, 1e-4, 'Initial C-C bond length is 1.54 Å');
      GeometryAdjuster.setBondLength(ethane, 0, 1, 2.00);
      const newBond = GeometryAdjuster.getBondLength(ethane, 0, 1);
      assertNear(newBond, 2.00, 1e-3, 'Adjusted C-C bond length to 2.00 Å');
      assertNear(ethane.atoms[2].x, 2.0 + (2.00 - 1.54), 1e-3, 'Subgroup H atom translated along with C2');

      // 測試鍵角調整
      const initialAngle = GeometryAdjuster.getBondAngle(ethane, 0, 1, 2);
      GeometryAdjuster.setBondAngle(ethane, 0, 1, 2, 120.0);
      const newAngle = GeometryAdjuster.getBondAngle(ethane, 0, 1, 2);
      assertNear(newAngle, 120.0, 1e-2, 'Adjusted bond angle to 120.0°');

      // 測試二面角調整
      ethane.addAtom('H', -0.5, 1.0, 0);
      ethane.detectBonds();
      GeometryAdjuster.setDihedralAngle(ethane, 3, 0, 1, 2, 60.0);
      const newDihedral = GeometryAdjuster.getDihedralAngle(ethane, 3, 0, 1, 2);
      assertNear(newDihedral, 60.0, 1e-2, 'Adjusted dihedral angle to 60.0°');

      log('=== 11. Atom Replacement Brush Mode Test ===');
      ctrl.isBrushMode = true;
      ctrl.brushElement = 'O';
      dummyApp.renderer.pickAtom = () => 0;
      ctrl.handleClick({ clientX: 10, clientY: 10, button: 0 });
      assert(dummyApp.structure.atoms[0].element === 'O', 'Brush replaced atom #1 with Oxygen');

      dummyApp.renderer.pickAtom = () => 1;
      ctrl.handleClick({ clientX: 20, clientY: 10, button: 0 });
      assert(dummyApp.structure.atoms[1].element === 'O', 'Brush replaced atom #2 with Oxygen');

      // 按 Esc 退出筆刷
      ctrl.onKeyDown({ key: 'Escape', code: 'Escape', preventDefault: () => {} });
      assert(!ctrl.isBrushMode, 'Escape key exited brush mode');

      log('=== 13. Ring Molecule Bond Adjustment Safety Test ===');
      const ringCaff = PRESETS.caffeine.build();
      const origCaffPos6 = [ringCaff.atoms[6].x, ringCaff.atoms[6].y, ringCaff.atoms[6].z];
      // 在咖啡因環狀分子中連續快速調整鍵長
      for (let step = 0; step < 10; step++) {
        GeometryAdjuster.setBondLength(ringCaff, 6, 7, 1.35 + step * 0.05);
      }
      assert(isFinite(ringCaff.atoms[6].x) && isFinite(ringCaff.atoms[7].x), 'Coordinates remain finite numbers');
      assertNear(ringCaff.atoms[6].x, origCaffPos6[0], 1e-4, 'Fixed atom idx6 was not drifted or moved');
      const caffMax = Math.max(...ringCaff.atoms.map(a => Math.hypot(a.x, a.y, a.z)));
      assert(caffMax < 25.0, `Molecule did not explode into infinity (max radius: ${caffMax.toFixed(2)} Å)`);

      log('=== 14. Brush Empty Space Atom Creation Test ===');
      ctrl.isBrushMode = true;
      ctrl.brushElement = 'Fe';
      dummyApp.renderer.camera.position.set(0, 0, 15);
      dummyApp.renderer.camera.lookAt(0, 0, 0);
      const initialFeCount = dummyApp.structure.atoms.filter(a => a.element === 'Fe').length;
      dummyApp.renderer.pickAtom = () => -1; // 模擬點擊空白處
      ctrl.handleClick({ clientX: 100, clientY: 100, button: 0 });
      const newFeCount = dummyApp.structure.atoms.filter(a => a.element === 'Fe').length;
      assert(newFeCount === initialFeCount + 1, 'Clicking empty space added new Fe atom (and auto saturated H)');
      const addedAtom = dummyApp.structure.atoms.find(a => a.element === 'Fe');
      assert(addedAtom && addedAtom.element === 'Fe', 'Added atom has element Fe');
      assert(addedAtom && isFinite(addedAtom.x) && isFinite(addedAtom.y) && isFinite(addedAtom.z), 'Added atom has valid 3D coordinates');
      ctrl.isBrushMode = false;

      log('=== 15. ActiveTool Sequence Auto-Dock Trigger Test ===');
      let bondDockOpened = false;
      dummyApp.openBondAdjustDock = () => { bondDockOpened = true; };
      ctrl.activeTool = 'mod_bond';
      ctrl.clearSelection();

      dummyApp.renderer.pickAtom = () => 2;
      ctrl.handleClick({ clientX: 10, clientY: 10, button: 0 });
      assert(!bondDockOpened, 'Dock not opened after 1st atom');

      dummyApp.renderer.pickAtom = () => 3;
      ctrl.handleClick({ clientX: 20, clientY: 10, button: 0 });
      assert(bondDockOpened, 'Dock opened automatically after 2nd atom clicked with mod_bond active');
      assert(ctrl.activeTool === null, 'ActiveTool reset to null after dock opened');

      log('=== 16. GaussView Movement & Rotation Modes Test ===');
      const ethaneModes = new Structure();
      ethaneModes.addAtom('C', 0, 0, 0);
      ethaneModes.addAtom('C', 1.54, 0, 0);
      ethaneModes.addAtom('H', 2.0, 1.0, 0);
      ethaneModes.detectBonds();
      const origC1 = ethaneModes.atoms[0].x;
      const origC2 = ethaneModes.atoms[1].x;
      // 測試 mode1 = 'atom', mode2 = 'fixed'：僅原子 1 移動，原子 2 固定
      GeometryAdjuster.setBondLength(ethaneModes, 0, 1, 2.0, 'atom', 'fixed');
      assertNear(ethaneModes.atoms[1].x, origC2, 1e-4, 'Atom 2 stayed completely fixed');
      assert(Math.abs(ethaneModes.atoms[0].x - origC1) > 0.3, 'Atom 1 moved towards target length');
      assertNear(GeometryAdjuster.getBondLength(ethaneModes, 0, 1), 2.0, 1e-4, 'Bond length reached 2.0 Å');

      // 測試兩端皆 Fixed 時的防護機制 (自動 fallback)
      GeometryAdjuster.setBondLength(ethaneModes, 0, 1, 1.8, 'fixed', 'fixed');
      assertNear(GeometryAdjuster.getBondLength(ethaneModes, 0, 1), 1.8, 1e-4, 'Fallback prevented freeze when both were fixed');

      // 測試兩側對稱移動 mode1 = 'group', mode2 = 'group'
      const posC1Before = ethaneModes.atoms[0].x;
      const posC2Before = ethaneModes.atoms[1].x;
      GeometryAdjuster.setBondLength(ethaneModes, 0, 1, 2.2, 'group', 'group');
      const shift1 = Math.abs(ethaneModes.atoms[0].x - posC1Before);
      const shift2 = Math.abs(ethaneModes.atoms[1].x - posC2Before);
      assertNear(shift1, shift2, 1e-4, 'Both sides moved symmetrically by equal amount');

      log('=== 17. GaussView Alt Drag Interaction Test ===');
      dummyApp.structure.atoms[0].selected = true;
      // Alt + 左鍵 (button === 0) -> 旋轉選中原子群 (rotate_atoms)
      ctrl.onPointerDown({ clientX: 50, clientY: 50, altKey: true, button: 0 });
      assert(ctrl.dragMode === 'rotate_atoms', 'Alt + Left click triggered rotate_atoms');
      assert(!dummyApp.renderer.controls.enabled, 'OrbitControls disabled during atom rotation');

      // Alt + 右鍵 (button === 2) -> 平移選中原子群 (move_atoms)
      ctrl.onPointerDown({ clientX: 50, clientY: 50, altKey: true, button: 2 });
      assert(ctrl.dragMode === 'move_atoms', 'Alt + Right click triggered move_atoms');

      log('=== 18. Periodic Boundary Cross-Cell Bond Offset & Cell Box Test ===');
      const siCryst = PRESETS.silicon.build();
      siCryst.detectBonds();
      const pbcBonds = siCryst.bonds.filter(b => b.offset && (b.offset[0] !== 0 || b.offset[1] !== 0 || b.offset[2] !== 0));
      assert(pbcBonds.length > 0, 'Detected bonds crossing periodic boundaries with non-zero offset');

      const testBoxRenderer = new MoleculeRenderer(document.createElement('div'));
      testBoxRenderer.visualReplicas = [2, 2, 2];
      testBoxRenderer.drawLatticeBox(siCryst.cell);
      // 單元晶胞線段必定剛好由 12 條邊組成 (12 * 2 頂點 = 24 頂點)
      const lineCount = testBoxRenderer.cellLines.geometry.attributes.position.count / 2;
      assert(lineCount === 12, `Only base unit cell box rendered (12 edges), outer replica box removed!`);

      log('=== 19. Local Hydrogen Saturation (VSEPR.saturateAtom) Test ===');
      const testSingleC = new Structure();
      testSingleC.addAtom('C', 0, 0, 0);
      VSEPR.saturateAtom(testSingleC, 0, 'sp3');
      assert(testSingleC.atoms.length === 5, `Single C saturated with 4 H's (total 5 atoms, got ${testSingleC.atoms.length})`);
      assert(testSingleC.atoms.filter(a => a.element === 'H').length === 4, 'Has exactly 4 Hydrogens');

      // 替換測試：將甲烷中心碳替換為氧 (O)，自動除氫並補足為 2 顆 H (水分子)
      testSingleC.atoms[0].element = 'O';
      VSEPR.saturateAtom(testSingleC, 0);
      assert(testSingleC.atoms.length === 3, `Methane C replaced by O saturated to H2O (total 3 atoms, got ${testSingleC.atoms.length})`);
      assert(testSingleC.atoms.filter(a => a.element === 'H').length === 2, 'O atom has exactly 2 Hydrogens attached');

      log('=== 20. Shift + Left Click Marquee Selection Trigger Test ===');
      ctrl.onPointerDown({ clientX: 100, clientY: 100, shiftKey: true, button: 0 });
      assert(ctrl.dragMode === 'box_select', 'Shift + Left click triggered box_select dragMode');
      assert(!dummyApp.renderer.controls.enabled, 'OrbitControls disabled during marquee drag');
      ctrl.onPointerUp({ clientX: 200, clientY: 200, shiftKey: true, button: 0 });
      assert(ctrl.dragMode === null, 'Drag mode reset after pointer up');
      assert(dummyApp.renderer.controls.enabled, 'OrbitControls re-enabled after pointer up');

      log('=== 21. Appearance & Styling (Background, Element Override, Atom Override, Spacefill) Test ===');
      const testStyleRenderer = new MoleculeRenderer(document.createElement('div'));
      testStyleRenderer.setBackgroundColor('#ffffff');
      assert(testStyleRenderer.backgroundColor === '#ffffff', 'Background color set to #ffffff');

      // Spacefill scale test
      testStyleRenderer.setStyle('spacefill');
      testStyleRenderer.setSpacefillScale(1.5);
      const rSpacefill = testStyleRenderer.getAtomRadius('C');
      testStyleRenderer.setSpacefillScale(1.0);
      const rSpacefillBase = testStyleRenderer.getAtomRadius('C');
      assertNear(rSpacefill, rSpacefillBase * 1.5, 1e-4, 'Spacefill scale 1.5x scaled radius proportionally');

      // Element-level override test
      testStyleRenderer.setElementOverride('Li', { color: '#123456', radiusScale: 2.0 });
      const rLiOver = testStyleRenderer.getAtomRadius('Li');
      const cLiOver = testStyleRenderer.getAtomColor('Li');
      assert(cLiOver === '#123456', `Element override color for Li is #123456, got ${cLiOver}`);
      testStyleRenderer.clearElementOverride('Li');
      assert(testStyleRenderer.elementOverrides['Li'] === undefined, 'Element override for Li successfully cleared');

      // Atom-level override test (單一原子自訂優先級最高)
      const mockAtom = { element: 'C', customColor: '#ff00aa', customRadius: 1.8 };
      const colCustom = testStyleRenderer.getAtomColor('C', mockAtom);
      const radCustom = testStyleRenderer.getAtomRadius('C', mockAtom);
      assert(colCustom === '#ff00aa', 'Atom-level customColor took highest priority');
      assertNear(radCustom, rSpacefillBase * 1.8, 1e-4, 'Atom-level customRadius scaled radius correctly');

      log('=== 22. Tinker XYZ Parser & Exporter Test ===');
      const tinkerText = ` 3  Water molecule
  1  O    0.000000    0.000000    0.119262     1     2     3
  2  H    0.000000    0.763239   -0.477047     2     1
  3  H    0.000000   -0.763239   -0.477047     2     1
`;
      assert(Parsers.isTinkerXYZ(tinkerText), 'isTinkerXYZ recognized Tinker XYZ content');
      const tinkerStruct = Parsers.parse(tinkerText, 'water.arc');
      assert(tinkerStruct.atoms.length === 3, `Tinker parsed 3 atoms, got ${tinkerStruct.atoms.length}`);
      assert(tinkerStruct.atoms[0].element === 'O', 'First atom is Oxygen');
      assert(tinkerStruct.atoms[1].element === 'H', 'Second atom is Hydrogen');
      assert(tinkerStruct.bonds.length >= 2, 'Tinker connectivity created bonds');
      const tinkerExport = Parsers.exportTinkerXYZ(tinkerStruct);
      assert(tinkerExport.includes(' 3  Water molecule') || tinkerExport.includes(' 3  Tinker Structure'), 'Tinker export has header');
      assert(tinkerExport.includes('O') && tinkerExport.includes('H'), 'Tinker export contains O and H atoms');

      log('=== 23. LAMMPS Data Parser & Exporter Test ===');
      const lammpsDataText = `LAMMPS Description
  2 atoms
  2 atom types

  -5.0 5.0 xlo xhi
  -5.0 5.0 ylo yhi
  -5.0 5.0 zlo zhi

  Masses

  1 12.011  # C
  2 1.008   # H

  Atoms # atomic

  1 1 0.0000 0.0000 0.0000
  2 2 0.0000 0.0000 1.0900
`;
      assert(Parsers.isLAMMPSData(lammpsDataText), 'isLAMMPSData recognized LAMMPS Data');
      const lammpsStruct = Parsers.parse(lammpsDataText, 'system.data');
      assert(lammpsStruct.atoms.length === 2, `LAMMPS parsed 2 atoms, got ${lammpsStruct.atoms.length}`);
      assert(lammpsStruct.atoms[0].element === 'C', 'Type 1 mapped to Carbon via mass/comment');
      assert(lammpsStruct.atoms[1].element === 'H', 'Type 2 mapped to Hydrogen via mass/comment');
      assert(lammpsStruct.cell !== null, 'Cell bounds created periodic cell');
      assertNear(lammpsStruct.cell[0][0], 10.0, 1e-4, 'Cell dimension lx is 10.0 Å');
      const lammpsExport = Parsers.exportLAMMPSData(lammpsStruct);
      assert(lammpsExport.includes('2 atoms') && lammpsExport.includes('xlo xhi'), 'LAMMPS export valid');

      log('=== 24. LAMMPS Dump Parser & VASP/PBD Dispatcher Test ===');
      const lammpsDumpText = `ITEM: TIMESTEP
  100
  ITEM: NUMBER OF ATOMS
  2
  ITEM: BOX BOUNDS pp pp pp
  0.0 15.0
  0.0 15.0
  0.0 15.0
  ITEM: ATOMS id type x y z
  1 1 1.00 2.00 3.00
  2 2 4.00 5.00 6.00
`;
      assert(Parsers.isLAMMPSDump(lammpsDumpText), 'isLAMMPSDump recognized dump format');
      const dumpStruct = Parsers.parse(lammpsDumpText, 'traj.dump');
      assert(dumpStruct.atoms.length === 2, `Dump parsed 2 atoms, got ${dumpStruct.atoms.length}`);
      assertNear(dumpStruct.cell[0][0], 15.0, 1e-4, 'Dump cell length is 15.0 Å');

      // VASP and PBD extension tests
      const vaspPoscarText = `Silicon Cell
  1.0
  5.43 0.0 0.0
  0.0 5.43 0.0
  0.0 0.0 5.43
  Si
  2
  Direct
  0.0 0.0 0.0
  0.25 0.25 0.25
`;
      const vaspExtStruct = Parsers.parse(vaspPoscarText, 'bulk_si.vasp');
      assert(vaspExtStruct.atoms.length === 2 && vaspExtStruct.atoms[0].element === 'Si', 'VASP .vasp file recognized and parsed');

      const pdbText = `HEADER    TEST
ATOM      1  N   ALA A   1       1.000   2.000   3.000  1.00  0.00           N
END
`;
      const pdbStruct = Parsers.parse(pdbText, 'structure.pdb');
      assert(pdbStruct.atoms.length === 1 && pdbStruct.atoms[0].element === 'N', '.pdb extension dispatched to PDB parser');

      log('=== 25. Recent Colors Queue & Deduplication Test ===');
      const recentColorsManager = {
        recentColors: ['#111111', '#222222', '#333333'],
        addRecentColor(colorHex) {
          if (!colorHex || typeof colorHex !== 'string') return;
          const hex = colorHex.toLowerCase().trim();
          if (!/^#[0-9a-f]{6}$/i.test(hex)) return;
          this.recentColors = [hex, ...this.recentColors.filter(c => c.toLowerCase() !== hex)].slice(0, 10);
        }
      };
      recentColorsManager.addRecentColor('#444444');
      assert(recentColorsManager.recentColors[0] === '#444444', 'New color added to front of recent colors');
      recentColorsManager.addRecentColor('#222222');
      assert(recentColorsManager.recentColors[0] === '#222222', 'Existing color moved to front without duplicate');
      assert(recentColorsManager.recentColors.filter(c => c === '#222222').length === 1, 'No duplicate colors in queue');

      for (let i = 0; i < 15; i++) {
        const hex = `#${i.toString(16).padStart(6, '0')}`;
        recentColorsManager.addRecentColor(hex);
      }
      assert(recentColorsManager.recentColors.length === 10, `Recent colors capped at 10 items, got ${recentColorsManager.recentColors.length}`);

      log('=== 26. Bond Topology Preservation & Order Adjustment Test ===');
      const structTopo = new Structure();
      structTopo.addAtom('C', 0, 0, 0);
      structTopo.addAtom('C', 1.54, 0, 0);
      structTopo.detectBonds();
      assert(structTopo.bonds.length === 1, 'Initial ethane-like bond formed');
      assert(structTopo.bonds[0].order === 1, 'Initial bond is single bond');

      // 1. Stretch bond to 4.5 Å using GeometryAdjuster.setBondLength (以往會被 detectBonds 刪除)
      GeometryAdjuster.setBondLength(structTopo, 0, 1, 4.5, 'fixed', 'atom');
      assertNear(structTopo.atoms[1].x, 4.5, 1e-4, 'Atom 1 moved to 4.5 Å');
      assert(structTopo.bonds.length === 1, 'Bond preserved and NOT destroyed even at 4.5 Å');
      assertNear(structTopo.bonds[0].dist, 4.5, 1e-4, 'Bond distance updated to 4.5 Å');

      // 2. Test setBondOrder
      // Set to double bond
      structTopo.setBondOrder(0, 1, 2);
      assert(structTopo.bonds.length === 1 && structTopo.bonds[0].order === 2, 'Bond order updated to Double (2)');

      // Set to triple bond
      structTopo.setBondOrder(0, 1, 3);
      assert(structTopo.bonds.length === 1 && structTopo.bonds[0].order === 3, 'Bond order updated to Triple (3)');

      // Set to hydrogen bond
      structTopo.setBondOrder(0, 1, 'hb');
      assert(structTopo.bonds.length === 1 && structTopo.bonds[0].order === 'hb', 'Bond order updated to Hydrogen Bond (hb)');

      // Set to None (0)
      structTopo.setBondOrder(0, 1, 0);
      assert(structTopo.bonds.length === 0, 'Bond removed when order set to None (0)');

      // Re-create as single bond
      structTopo.setBondOrder(0, 1, 1);
      assert(structTopo.bonds.length === 1 && structTopo.bonds[0].order === 1, 'New bond created between atoms');

      log('=== 27. Automatic Bond Order Perception & Hydrogen Bond & VSEPR Test ===');
      // 1. Acetylene (H-C#C-H) bond order perception
      const sAcetylene = new Structure();
      sAcetylene.addAtom('C', -0.60, 0, 0);
      sAcetylene.addAtom('C',  0.60, 0, 0); // d = 1.20 Å
      sAcetylene.addAtom('H', -1.66, 0, 0);
      sAcetylene.addAtom('H',  1.66, 0, 0);
      sAcetylene.detectBonds();
      const ccBond = sAcetylene.bonds.find(b =>
        (sAcetylene.atoms[b.a].element === 'C' && sAcetylene.atoms[b.b].element === 'C')
      );
      assert(ccBond !== undefined, 'Acetylene C-C bond detected');
      assert(ccBond.order === 3, `Acetylene C-C bond correctly perceived as Triple Bond (order: 3), got ${ccBond ? ccBond.order : 'none'}`);

      // 2. Carbon dioxide (O=C=O) bond order perception
      const sCO2 = new Structure();
      sCO2.addAtom('C', 0, 0, 0);
      sCO2.addAtom('O', 0, 0, 1.16); // d = 1.16 Å
      sCO2.addAtom('O', 0, 0, -1.16); // d = 1.16 Å
      sCO2.detectBonds();
      assert(sCO2.bonds.length === 2, 'CO2 has 2 C-O bonds');
      assert(sCO2.bonds[0].order === 2 && sCO2.bonds[1].order === 2, 'CO2 C=O bonds correctly perceived as Double Bonds (order: 2)');

      // 3. Ethylene (H2C=CH2) bond order perception
      const sEthylene = new Structure();
      sEthylene.addAtom('C', -0.67, 0, 0);
      sEthylene.addAtom('C',  0.67, 0, 0); // d = 1.34 Å
      sEthylene.addAtom('H', -1.23, 0.93, 0);
      sEthylene.addAtom('H', -1.23, -0.93, 0);
      sEthylene.addAtom('H',  1.23, 0.93, 0);
      sEthylene.addAtom('H',  1.23, -0.93, 0);
      sEthylene.detectBonds();
      const cDoubleBond = sEthylene.bonds.find(b =>
        (sEthylene.atoms[b.a].element === 'C' && sEthylene.atoms[b.b].element === 'C')
      );
      assert(cDoubleBond !== undefined && cDoubleBond.order === 2, `Ethylene C=C bond perceived as Double Bond (order: 2), got ${cDoubleBond?.order}`);

      // 4. Water dimer hydrogen bond detection
      const sDimer = new Structure();
      sDimer.addAtom('O', 0, 0, 0);
      sDimer.addAtom('H', 0.96, 0, 0);
      sDimer.addAtom('H', -0.24, 0.93, 0);
      sDimer.addAtom('O', 2.86, 0, 0); // H(1) ··· O(3) dist = 1.90 Å, angle O-H···O = 180°
      sDimer.addAtom('H', 3.40, 0.70, 0);
      sDimer.addAtom('H', 3.40, -0.70, 0);
      sDimer.detectBonds();
      const hb = sDimer.bonds.find(b => b.order === 'hb');
      assert(hb !== undefined, 'Hydrogen bond between water molecules detected');
      assertNear(hb ? hb.dist : 0, 1.90, 0.05, 'Hydrogen bond distance is approx 1.90 Å');

      // 5. VSEPR Hybridization Upgrade (CO2 bent -> linear relaxation)
      const sCO2Bent = new Structure();
      sCO2Bent.addAtom('C', 0, 0, 0);
      sCO2Bent.addAtom('O', 1.16, 0, 0);
      sCO2Bent.addAtom('O', -0.75, 0.89, 0); // Intentionally distorted to ~130 degrees
      sCO2Bent.detectBonds();
      VSEPR.cleanGeometry(sCO2Bent);
      const angleCO2 = GeometryAdjuster.getBondAngle(sCO2Bent, 1, 0, 2);
      assertNear(angleCO2, 180.0, 10.0, `VSEPR relaxed CO2 towards 180° linear geometry, got ${angleCO2.toFixed(1)}°`);

      // 6. VSEPR Hydrogen bond protection test
      VSEPR.cleanGeometry(sDimer);
      const hbDistAfter = sDimer.getDistance(hb.a, hb.b);
      assert(hbDistAfter > 1.6, `Hydrogen bond distance after VSEPR clean preserved as non-covalent (${hbDistAfter.toFixed(2)} Å > 1.6 Å)`);

      log('=== 28. UFF-Clean Engine (Ring Perception, Planarity & Dihedrals) Test ===');
      // 1. Ring perception on 5-membered ring
      const sRing5 = new Structure();
      for (let i = 0; i < 5; i++) {
        const th = (i * 72 * Math.PI) / 180;
        sRing5.addAtom('C', 1.4 * Math.cos(th), 1.4 * Math.sin(th), 0);
      }
      sRing5.detectBonds();
      const covNbrs = Array.from({ length: 5 }, () => []);
      for (const b of sRing5.bonds) {
        covNbrs[b.a].push(b.b);
        covNbrs[b.b].push(b.a);
      }
      const ringSizeDetected = VSEPR.findSmallestRingForAngle(0, 1, 4, covNbrs);
      assert(ringSizeDetected === 5, `Smallest ring size detected for 5-ring angle is 5, got ${ringSizeDetected}`);
      const ringTargetAngle = VSEPR.getTargetAngle(0, 1, 4, sRing5.atoms, covNbrs, new Int32Array(5));
      assertNear(ringTargetAngle, 108.0, 0.1, `Ring target angle for 5-ring is 108° (actual: ${ringTargetAngle}°)`);

      // 2. Caffeine clean, planarity retention, and perfect valence check
      const sCaffeine = PRESETS.caffeine.build();
      // 嚴格檢驗咖啡因所有 24 個原子的鍵級與化學價態完全符合標準八隅體！
      let allValencesCorrect = true;
      for (let i = 0; i < sCaffeine.atoms.length; i++) {
        const a = sCaffeine.atoms[i];
        const inc = sCaffeine.bonds.filter(b => b.a === i || b.b === i);
        const totV = inc.reduce((acc, b) => acc + (typeof b.order === 'number' ? b.order : 1), 0);
        const expectedV = a.element === 'C' ? 4 : (a.element === 'N' ? 3 : (a.element === 'O' ? 2 : 1));
        if (totV !== expectedV) {
          allValencesCorrect = false;
          log(`[FAIL] Caffeine atom #${i} (${a.element}) has valence ${totV}, expected ${expectedV}`);
        }
      }
      assert(allValencesCorrect, 'All 24 atoms in Caffeine have exact target valences (C=4, N=3, O=2, H=1, no C with 3 bonds, no N with 2 bonds)');

      const initialBondsCount = sCaffeine.bonds.length;
      VSEPR.cleanGeometry(sCaffeine);
      assert(sCaffeine.bonds.length === initialBondsCount, 'Caffeine bonds count preserved by topology lock');
      let maxPurineZ = -Infinity, minPurineZ = Infinity;
      const purineCoreIndices = [2, 3, 4, 5, 6, 7, 8, 9, 10]; // 嘌呤稠環骨架原子
      for (const idx of purineCoreIndices) {
        const z = sCaffeine.atoms[idx].z;
        if (z > maxPurineZ) maxPurineZ = z;
        if (z < minPurineZ) minPurineZ = z;
      }
      const purineZSpan = maxPurineZ - minPurineZ;
      assert(purineZSpan < 0.15, `Caffeine purine ring core remains strictly planar (Z span: ${purineZSpan.toFixed(4)} Å < 0.15 Å)`);

      // 3. Twisted ethylene relaxes towards planar
      const sEthTwisted = new Structure();
      sEthTwisted.addAtom('C', -0.67, 0, 0);
      sEthTwisted.addAtom('C',  0.67, 0, 0); // double bond along X
      sEthTwisted.addAtom('H', -1.23,  0.93, 0);
      sEthTwisted.addAtom('H', -1.23, -0.93, 0);
      const sin45 = Math.sin(Math.PI / 4), cos45 = Math.cos(Math.PI / 4);
      sEthTwisted.addAtom('H', 1.23,  0.93 * cos45,  0.93 * sin45);
      sEthTwisted.addAtom('H', 1.23, -0.93 * cos45, -0.93 * sin45);
      sEthTwisted.detectBonds();
      VSEPR.cleanGeometry(sEthTwisted);
      const dihedAfter = GeometryAdjuster.getDihedralAngle(sEthTwisted, 2, 0, 1, 4);
      const devFromPlanar = Math.min(Math.abs(dihedAfter), Math.abs(Math.abs(dihedAfter) - 180));
      assert(devFromPlanar < 15.0, `Twisted ethylene relaxed towards planar double bond (deviation: ${devFromPlanar.toFixed(1)}° < 15°)`);

      log('=== 29. Mutual Exclusion between Brush Mode & Bond Tool and Robust Escape Test ===');
      // 1. 筆刷模式開啟中
      ctrl.isBrushMode = true;
      ctrl.brushElement = 'N';
      assert(ctrl.isBrushMode === true, 'Brush mode initially true');

      // 2. 使用者直接點擊鍵長微調模式 (無按 Esc)
      ctrl.activeTool = 'mod_bond';
      // 當 activeTool 被啟動，handleClick 應自動退出筆刷模式並選取原子，絕不替換原子
      dummyApp.renderer.pickAtom = () => 0;
      const elemBefore = dummyApp.structure.atoms[0].element;
      ctrl.handleClick({ clientX: 10, clientY: 10, button: 0 });
      assert(!ctrl.isBrushMode, 'Brush mode automatically deactivated when activeTool is active');
      assert(dummyApp.structure.atoms[0].element === elemBefore, 'Atom element was NOT modified by brush during activeTool');
      assert(ctrl.selectedSequence.includes(0), 'Atom was correctly selected for bond adjustment');

      // 3. 模擬在輸入框獲得焦點時按下 Escape
      const dummyInput = document.createElement('input');
      let blurred = false;
      dummyInput.blur = () => { blurred = true; };
      ctrl.onKeyDown({ key: 'Escape', code: 'Escape', target: dummyInput, preventDefault: () => {}, stopPropagation: () => {} });
      assert(blurred, 'Escape from inside input blurred the input');
      assert(!ctrl.activeTool, 'Escape canceled activeTool');

      // 4. 當處於筆刷模式時按下 Escape，保證 deactivateBrushMode 被呼叫退出
      ctrl.isBrushMode = true;
      ctrl.onKeyDown({ key: 'Escape', code: 'Escape', target: document.body, preventDefault: () => {}, stopPropagation: () => {} });
      assert(!ctrl.isBrushMode, 'Escape cleanly deactivated brush mode');

      log('=== 30. Advanced Bond Order Perception & Valence-Aware Hydrogen Addition Test ===');
      // 1. 苯環 Kekule 交替單雙鍵與精準加氫驗證 (Benzene C6 -> C6H6)
      const sBenzeneBare = new Structure();
      const rC = 1.397;
      for (let i = 0; i < 6; i++) {
        const theta = (i * 60 * Math.PI) / 180;
        sBenzeneBare.addAtom('C', rC * Math.cos(theta), rC * Math.sin(theta), 0);
      }
      sBenzeneBare.detectBonds();
      const doubleCount = sBenzeneBare.bonds.filter(b => b.order === 2).length;
      const singleCount = sBenzeneBare.bonds.filter(b => b.order === 1).length;
      assert(doubleCount === 3 && singleCount === 3, `Benzene ring has 3 double and 3 single bonds (Kekule), got ${doubleCount} double and ${singleCount} single`);

      // 執行加氫：6 個碳應剛好各加 1 顆氫，總共 12 顆原子 (C6H6)
      VSEPR.addHydrogens(sBenzeneBare);
      assert(sBenzeneBare.atoms.length === 12, `Benzene auto-hydrogenation resulted in exactly 12 atoms (C6H6), got ${sBenzeneBare.atoms.length}`);
      const hCount = sBenzeneBare.atoms.filter(a => a.element === 'H').length;
      assert(hCount === 6, `Exactly 6 Hydrogens added to benzene, got ${hCount}`);

      // 再次執行加氫：已有飽和價態，應不再添加任何氫 (Idempotency)
      VSEPR.addHydrogens(sBenzeneBare);
      assert(sBenzeneBare.atoms.length === 12, `Second addHydrogens on C6H6 did not add redundant hydrogens, got ${sBenzeneBare.atoms.length}`);

      // 2. 羰基甲醛 C=O 骨架加氫驗證 (Formaldehyde C=O -> H2C=O)
      const sFormaldehyde = new Structure();
      sFormaldehyde.addAtom('C', 0, 0, 0);
      sFormaldehyde.addAtom('O', 0, 1.21, 0); // d = 1.21 Å, 羰基雙鍵
      sFormaldehyde.detectBonds();
      assert(sFormaldehyde.bonds[0].order === 2, `C=O bond correctly perceived as double bond (order: 2), got ${sFormaldehyde.bonds[0].order}`);

      VSEPR.addHydrogens(sFormaldehyde);
      // 碳應補 2 顆氫形成甲醛 H2C=O，羰基氧絕不可補氫！
      const formH = sFormaldehyde.atoms.filter(a => a.element === 'H').length;
      assert(formH === 2, `Formaldehyde added exactly 2 Hydrogens to Carbon, got ${formH}`);
      const formO_neighbors = sFormaldehyde.bonds.filter(b => b.a === 1 || b.b === 1).length;
      assert(formO_neighbors === 1, `Carbonyl Oxygen has no attached Hydrogens (still 1 bond to C), got ${formO_neighbors}`);

      // 3. 炔烴 C#C 骨架加氫驗證 (Acetylene C#C -> HC#CH)
      const sAcet = new Structure();
      sAcet.addAtom('C', 0, 0, 0);
      sAcet.addAtom('C', 1.20, 0, 0); // d = 1.20 Å, 碳碳三鍵
      sAcet.detectBonds();
      assert(sAcet.bonds[0].order === 3, `C#C bond perceived as triple bond (order: 3)`);
      VSEPR.addHydrogens(sAcet);
      assert(sAcet.atoms.length === 4, `Acetylene added exactly 2 Hydrogens (HC#CH), got ${sAcet.atoms.length}`);
      VSEPR.addHydrogens(sAcet);
      assert(sAcet.atoms.length === 4, `Second addHydrogens on HC#CH did not add extra hydrogens`);

      // 4. 局部補氫 saturateAtom on C=O 驗證
      const sKetone = new Structure();
      sKetone.addAtom('C', 0, 0, 0);
      sKetone.addAtom('O', 0, 1.21, 0);
      sKetone.detectBonds();
      VSEPR.saturateAtom(sKetone, 0); // 對碳進行局部補氫
      assert(sKetone.atoms.length === 4, `saturateAtom on C=O carbon added exactly 2 Hydrogens (H2C=O), got ${sKetone.atoms.length}`);

      // 5. 咖啡因自動加氫驗證 (Caffeine Hydrogenation Idempotency & Re-hydrogenation)
      const caffTest = PRESETS.caffeine.build();
      VSEPR.addHydrogens(caffTest);
      assert(caffTest.atoms.length === 24, `Fully saturated Caffeine has 0 extra hydrogens added, got ${caffTest.atoms.length}`);
      VSEPR.removeHydrogens(caffTest);
      assert(caffTest.atoms.length === 14, `Caffeine bare skeleton has 14 heavy atoms after removeHydrogens, got ${caffTest.atoms.length}`);
      VSEPR.addHydrogens(caffTest);
      assert(caffTest.atoms.length === 24, `Re-hydrogenation on bare Caffeine skeleton restored exactly 10 hydrogens (24 total atoms), got ${caffTest.atoms.length}`);

      log('=== 31. GaussView-Style Sequential Fragment Extension on Hydrogens Test ===');
      // 1. 烷烴鏈連續接枝生長：甲烷 (CH4) -> 乙烷 (C2H6) -> 丙烷 (C3H8) -> 丁烷 (C4H10)
      const sAlkane = new Structure();
      sAlkane.addAtom('C', 0, 0, 0);
      VSEPR.saturateAtom(sAlkane, 0, 'sp3');
      assert(sAlkane.atoms.length === 5 && sAlkane.bonds.length === 4, 'Step 0: Initial Methane (CH4) created with 5 atoms, 4 bonds');

      // 步驟 1：點擊甲烷任一氫原子 (index 1)，接枝 sp3 碳原子 -> 應生成乙烷 (C2H6)
      VSEPR.attachFragment(sAlkane, 1, 'C', 'sp3');
      assert(sAlkane.atoms.length === 8, `Step 1: Ethane (C2H6) has 8 atoms, got ${sAlkane.atoms.length}`);
      assert(sAlkane.bonds.length === 7, `Step 1: Ethane (C2H6) has 7 bonds, got ${sAlkane.bonds.length}`);
      const cIndicesEthane = sAlkane.atoms.map((a, idx) => a.element === 'C' ? idx : -1).filter(idx => idx !== -1);
      assert(cIndicesEthane.length === 2, 'Ethane has 2 Carbons');
      const ccBondsEthane = sAlkane.bonds.filter(b => sAlkane.atoms[b.a].element === 'C' && sAlkane.atoms[b.b].element === 'C');
      assert(ccBondsEthane.length === 1, `Ethane has exactly 1 C-C bond, got ${ccBondsEthane.length}`);
      assertNear(ccBondsEthane[0].dist, 1.54, 1e-3, 'Ethane C-C bond distance is ideal 1.54 Å');

      // 步驟 2：點擊乙烷新碳原子上的氫原子 (例如 index 5)，接枝第三個 sp3 碳原子 -> 應生成丙烷 (C3H8)
      // 關鍵驗證：第三個碳與第一個碳距離應約 2.515 Å，絕對不可被誤判定為三角成鍵 (杜絕環丙烷誤判)
      VSEPR.attachFragment(sAlkane, 5, 'C', 'sp3');
      assert(sAlkane.atoms.length === 11, `Step 2: Propane (C3H8) has 11 atoms, got ${sAlkane.atoms.length}`);
      assert(sAlkane.bonds.length === 10, `Step 2: Propane (C3H8) has 10 bonds, got ${sAlkane.bonds.length}`);
      const ccBondsPropane = sAlkane.bonds.filter(b => sAlkane.atoms[b.a].element === 'C' && sAlkane.atoms[b.b].element === 'C');
      assert(ccBondsPropane.length === 2, `Propane has exactly 2 C-C bonds (NO 3-membered ring triangular cross-bond!), got ${ccBondsPropane.length}`);
      const cIndicesPropane = sAlkane.atoms.map((a, idx) => a.element === 'C' ? idx : -1).filter(idx => idx !== -1);
      const c0 = sAlkane.atoms[cIndicesPropane[0]];
      const c2 = sAlkane.atoms[cIndicesPropane[2]];
      const dist13 = Math.hypot(c0.x - c2.x, c0.y - c2.y, c0.z - c2.z);
      assert(dist13 > 2.45, `1,3-Carbon distance in Propane is ${dist13.toFixed(3)} Å > 2.45 Å (safe from cross-bonding)`);

      // 步驟 3：點擊丙烷端點碳之氫原子，接枝第四個 sp3 碳原子 -> 應生成丁烷 (C4H10)
      const hOnC3 = sAlkane.atoms.findIndex((a, idx) => idx >= 8 && a.element === 'H');
      VSEPR.attachFragment(sAlkane, hOnC3, 'C', 'sp3');
      assert(sAlkane.atoms.length === 14, `Step 3: Butane (C4H10) has 14 atoms, got ${sAlkane.atoms.length}`);
      assert(sAlkane.bonds.length === 13, `Step 3: Butane (C4H10) has 13 bonds, got ${sAlkane.bonds.length}`);
      const ccBondsButane = sAlkane.bonds.filter(b => sAlkane.atoms[b.a].element === 'C' && sAlkane.atoms[b.b].element === 'C');
      assert(ccBondsButane.length === 3, `Butane has exactly 3 C-C bonds, got ${ccBondsButane.length}`);

      // 2. 水分子接枝碳片段驗證：水 (H2O) -> 甲醇 (CH3OH)
      const sWater = new Structure();
      sWater.addAtom('O', 0, 0, 0);
      sWater.addAtom('H', 0.76, 0.59, 0);
      sWater.addAtom('H', -0.76, 0.59, 0);

      assert(sWater.atoms.length === 6, `Methanol (CH3OH) has 6 atoms (1 C, 1 O, 4 H), got ${sWater.atoms.length}`);
      const coBond = sWater.bonds.find(b =>
        (sWater.atoms[b.a].element === 'C' && sWater.atoms[b.b].element === 'O') ||
        (sWater.atoms[b.a].element === 'O' && sWater.atoms[b.b].element === 'C')
      );
      assert(coBond !== undefined, 'C-O bond correctly created in Methanol');
      assertNear(coBond.dist, 1.43, 1e-3, 'Methanol C-O bond distance is ideal 1.43 Å');

      // 3. 畫布點擊控制器整合測試：模擬使用者在筆刷模式下點選氫原子連續接枝
      const dummyApp2 = {
        pushHistory: () => {},
        updateUI: () => {},
        showToast: () => {},
        structure: new Structure(),
        renderer: {
          update: () => {},
          controls: { enabled: true },
          renderer: { domElement: document.createElement('div') },
          camera: new THREE.PerspectiveCamera(),
          pickAtom: () => -1
        }
      };
      const ctrl2 = new InteractionController(dummyApp2);
      ctrl2.isBrushMode = true;
      ctrl2.brushElement = 'C';
      ctrl2.activeHybrid = 'sp3';
      // 建立初始 CH4
      dummyApp2.structure.addAtom('C', 0, 0, 0);
      VSEPR.saturateAtom(dummyApp2.structure, 0, 'sp3');
      assert(dummyApp2.structure.atoms.length === 5, 'Initial Methane in controller has 5 atoms');

      // 點選氫原子 #1 接枝為乙烷

      ctrl2.handleClick({ clientX: 10, clientY: 10, button: 0 });

      // 點選新碳原子上的氫原子 #5 接枝為丙烷

      ctrl2.handleClick({ clientX: 10, clientY: 10, button: 0 });
      assert(dummyApp2.structure.atoms.length === 11, 'Controller click on H produced Propane (11 atoms)');
      const ctrlCC = dummyApp2.structure.bonds.filter(b =>
        dummyApp2.structure.atoms[b.a].element === 'C' && dummyApp2.structure.atoms[b.b].element === 'C'
      );
      assert(ctrlCC.length === 2, `Controller Propane has exactly 2 C-C bonds without spurious cross-bonds, got ${ctrlCC.length}`);

      log('=== 32. Non-orthogonal Lattice Fidelity, MS Surface Cleaver & Asymmetric Vacuum Test ===');

      // 1. 嚴格晶格保真度測試 (非正交單斜/六方/三斜)
      const hexStruct = new Structure();
      hexStruct.setCellParameters(2.50, 2.50, 4.00, 90.0, 90.0, 120.0);
      const hexP = hexStruct.getCellParameters();
      assertNear(hexP.a, 2.50, 1e-4, 'Hexagonal cell a = 2.50 Å');
      assertNear(hexP.b, 2.50, 1e-4, 'Hexagonal cell b = 2.50 Å');
      assertNear(hexP.c, 4.00, 1e-4, 'Hexagonal cell c = 4.00 Å');
      assertNear(hexP.alpha, 90.0, 1e-3, 'Hexagonal cell alpha = 90.0°');
      assertNear(hexP.beta, 90.0, 1e-3, 'Hexagonal cell beta = 90.0°');
      assertNear(hexP.gamma, 120.0, 1e-3, 'Hexagonal cell gamma = 120.0° (strictly non-orthogonal)');
      assertNear(hexP.volume, 21.6506, 1e-2, 'Hexagonal cell volume = 21.65 Å³');

      // 分數座標與笛卡爾座標精確互換測試
      hexStruct.addAtom('C', 0, 0, 0);
      const atomHex = hexStruct.atoms[0];
      const frac0 = hexStruct.cartesianToFractional(atomHex.x, atomHex.y, atomHex.z);
      assertNear(frac0[0], 0, 1e-4, 'Fractional u = 0');
      assertNear(frac0[1], 0, 1e-4, 'Fractional v = 0');
      assertNear(frac0[2], 0, 1e-4, 'Fractional w = 0');

      // 2. Materials Studio 表面基底向量解析計算測試 (findSurfaceBasis)
      const basis001 = Crystal.findSurfaceBasis(0, 0, 1);
      assert(basis001.u[0] === 1 && basis001.u[1] === 0 && basis001.u[2] === 0, 'Basis (001) u = [1, 0, 0]');
      assert(basis001.v[0] === 0 && basis001.v[1] === 1 && basis001.v[2] === 0, 'Basis (001) v = [0, 1, 0]');

      const basis110 = Crystal.findSurfaceBasis(1, 1, 0);
      assert(basis110.u[0] === -1 && basis110.u[1] === 1 && basis110.u[2] === 0, 'Basis (110) u = [-1, 1, 0]');
      assert(basis110.v[0] === 0 && basis110.v[1] === 0 && basis110.v[2] === 1, 'Basis (110) v = [0, 0, 1]');

      const basis111 = Crystal.findSurfaceBasis(1, 1, 1);
      assert(basis111.u[0] === -1 && basis111.u[1] === 1 && basis111.u[2] === 0, 'Basis (111) u = [-1, 1, 0]');
      assert(basis111.v[0] === 0 && basis111.v[1] === -1 && basis111.v[2] === 1, 'Basis (111) v = [0, -1, 1]');

      // 3. 晶面間距 d_hkl 解析計算測試 (calculatePlaneSpacing)
      const siBulk = new Structure();
      const aSi = 5.430;
      siBulk.setCellParameters(aSi, aSi, aSi, 90, 90, 90);
      const siBasisFrac = [
        [0.0, 0.0, 0.0],
        [0.0, 0.5, 0.5],
        [0.5, 0.0, 0.5],
        [0.5, 0.5, 0.0],
        [0.25, 0.25, 0.25],
        [0.25, 0.75, 0.75],
        [0.75, 0.25, 0.75],
        [0.75, 0.75, 0.25]
      ];
      for (const [fx, fy, fz] of siBasisFrac) {
        siBulk.addAtom('Si', fx * aSi, fy * aSi, fz * aSi);
      }
      siBulk.detectBonds();
      assert(siBulk.atoms.length === 8, 'Si bulk conventional cell has 8 atoms');

      const p001 = Crystal.calculatePlaneSpacing(siBulk.cell, 0, 0, 1);
      assertNear(p001.d_hkl, 5.430, 1e-3, 'Si(001) d_hkl = 5.430 Å');

      const p110 = Crystal.calculatePlaneSpacing(siBulk.cell, 1, 1, 0);
      assertNear(p110.d_hkl, 5.430 / Math.SQRT2, 1e-3, 'Si(110) d_hkl = 3.840 Å');

      const p111 = Crystal.calculatePlaneSpacing(siBulk.cell, 1, 1, 1);
      assertNear(p111.d_hkl, 5.430 / Math.sqrt(3), 1e-3, 'Si(111) d_hkl = 3.135 Å');

      // 4. Materials Studio 風格表面切割測試 (cleaveSurface)
      const slabSi111 = siBulk.clone();
      const cleaveSuccess = Crystal.cleaveSurface(slabSi111, {
        h: 1, k: 1, l: 1,
        layers: 2,
        shift: 0.0,
        topVacuum: 15.0,
        bottomVacuum: 0.0
      });
      assert(Boolean(cleaveSuccess && cleaveSuccess.success), 'Crystal.cleaveSurface for Si(111) returned success');
      assert(slabSi111.atoms.length > 0, `Cleaved Si(111) slab has ${slabSi111.atoms.length} atoms`);
      assert(slabSi111.cell !== null, 'Cleaved slab has valid unit cell');

      // 檢查法向量對齊 +Z (晶格 c 向量指向 Z 軸，c_x 與 c_y 近似 0)
      const cellC = slabSi111.cell[2];
      assertNear(cellC[0], 0.0, 1e-3, 'Surface slab c-vector aligned to Z (c_x ≈ 0)');
      assertNear(cellC[1], 0.0, 1e-3, 'Surface slab c-vector aligned to Z (c_y ≈ 0)');
      assert(cellC[2] > 15.0, `Surface slab c_z (${cellC[2].toFixed(2)} Å) > vacuum thickness`);

      // 5. 非對稱真空層分析器測試 (analyzeVacuum)
      const vacAnalysis = Crystal.analyzeVacuum(slabSi111, 'z');
      assert(vacAnalysis !== null, 'analyzeVacuum returned valid analysis');
      assertNear(vacAnalysis.bottomVacuum, 0.0, 0.01, 'Bottom vacuum starts at 0.0 Å (bottom aligned)');
      assertNear(vacAnalysis.topVacuum, 15.0, 0.01, 'Top vacuum starts at 15.0 Å');
      assertNear(vacAnalysis.totalVacuum, 15.0, 0.01, 'Total vacuum is 15.0 Å');
      assert(vacAnalysis.slabThickness > 0, `Slab material thickness is ${vacAnalysis.slabThickness.toFixed(2)} Å`);

      // 6. 非對稱獨立頂底真空層設定測試 (adjustVacuum)
      Crystal.adjustVacuum(slabSi111, {
        axis: 'z',
        topVacuum: 20.0,
        bottomVacuum: 5.0
      });
      const vacAnalysis2 = Crystal.analyzeVacuum(slabSi111, 'z');
      assertNear(vacAnalysis2.bottomVacuum, 5.0, 0.01, 'Bottom vacuum accurately set to 5.0 Å');
      assertNear(vacAnalysis2.topVacuum, 20.0, 0.01, 'Top vacuum accurately set to 20.0 Å');
      assertNear(vacAnalysis2.totalVacuum, 25.0, 0.01, 'Total vacuum is 25.0 Å');
      assertNear(vacAnalysis2.cellLength, vacAnalysis.slabThickness + 25.0, 0.05, 'New unit cell length = slab thickness + top + bottom vacuum');

      // 7. 測試置中對稱 (center: true)
      Crystal.adjustVacuum(slabSi111, {
        axis: 'z',
        topVacuum: 10.0,
        bottomVacuum: 10.0,
        center: true
      });
      const vacAnalysis3 = Crystal.analyzeVacuum(slabSi111, 'z');
      assertNear(vacAnalysis3.bottomVacuum, 10.0, 0.01, 'Centered bottom vacuum = 10.0 Å');
      assertNear(vacAnalysis3.topVacuum, 10.0, 0.01, 'Centered top vacuum = 10.0 Å');

      // 8. 預設空白系統初始化驗證
      const freshStruct = new Structure();
      assert(freshStruct.atoms.length === 0, 'Fresh Structure starts with 0 atoms on canvas (clean empty startup)');
      assert(freshStruct.bonds.length === 0, 'Fresh Structure starts with 0 bonds on canvas');
      assert(freshStruct.cell === null, 'Fresh Structure starts with null cell (no preset loaded)');

      log('=== 33. Unconstrained 3D Camera Rotation & Gimbal-Lock-Free Verification ===');
      const domEl = document.createElement('div');
      domEl.clientHeight = 600;
      domEl.clientWidth = 800;
      const testCam = new THREE.PerspectiveCamera(45, 800 / 600, 0.1, 1000);
      testCam.position.set(0, 0, 30);
      testCam.up.set(0, 1, 0);
      testCam.lookAt(0, 0, 0);

      const testControls = new THREE.OrbitControls(testCam, domEl);
      assert(testControls.unconstrainedRotation === true, 'OrbitControls defaults to unconstrainedRotation = true');

      // 模擬沿著軸向連續垂直轉動穿過極點 (Over-the-pole tumbling)
      // 旋轉 4.0 弧度 (> Math.PI = 3.14159 rad，傳統 OrbitControls 必然限位卡死在 3.14159)
      const initialDist = testCam.position.distanceTo(testControls.target);
      assertNear(initialDist, 30.0, 1e-4, 'Initial camera distance is 30.0 Å');

      // 模擬向上連續拖曳 80 次，每次 0.05 rad (累積 4.0 rad > 229°)
      for (let i = 0; i < 80; i++) {
        testControls.handleMouseMoveRotate ? testControls.handleMouseMoveRotate({ clientX: 100, clientY: 100 - 10 }) : null;
        // 直接調用 internal update
        testControls.update();
      }

      // 驗證未卡死在極點，相機距離保持嚴格守恆，且無 NaN 異常
      const afterDist = testCam.position.distanceTo(testControls.target);
      assertNear(afterDist, 30.0, 1e-3, 'Camera distance strictly conserved after tumbling through pole');
      assert(Number.isFinite(testCam.position.x) && Number.isFinite(testCam.position.y) && Number.isFinite(testCam.position.z), 'Camera coordinates are valid finite numbers without NaN or singularity');

      // 驗證相機 up 向量正常旋轉伴隨，長度保持 1.0
      assertNear(testCam.up.length(), 1.0, 1e-4, 'Camera up-vector unit length conserved');

      log('=== 34. MS Surface Cleaver 3D Live Preview & Compact Dock Verification ===');
      const testCont = document.createElement('div');
      testCont.id = 'cleaver-test-container';
      testCont.style.width = '400px';
      testCont.style.height = '300px';
      document.body.appendChild(testCont);

      const mRenderer = new MoleculeRenderer('cleaver-test-container');
      assert(mRenderer.cleavePreviewGroup instanceof THREE.Group, 'Renderer initializes cleavePreviewGroup');
      assert(mRenderer.cleavePreviewGroup.children.length === 0, 'cleavePreviewGroup starts empty');

      // 1. 建立 Si Bulk 晶胞並測試 (1 1 1) 面預覽
      const siBulkPreview = new Structure();
      siBulkPreview.setCell([[5.43, 0, 0], [0, 5.43, 0], [0, 0, 5.43]]);
      siBulkPreview.addAtom('Si', 0, 0, 0);
      siBulkPreview.addAtom('Si', 1.3575, 1.3575, 1.3575);

      mRenderer.updateCleavePreview(siBulkPreview, {
        h: 1, k: 1, l: 1,
        layers: 3,
        shift: 0.25
      });

      assert(mRenderer.cleavePreviewGroup.children.length > 0, 'cleavePreviewGroup populated with preview objects');

      // 驗證 12 條立體晶格虛線框 (Dashed Box)
      const dashedBox = mRenderer.cleavePreviewGroup.children.find(
        c => c instanceof THREE.LineSegments && c.material instanceof THREE.LineDashedMaterial
      );
      assert(dashedBox !== undefined, 'Dashed bounding box LineSegments found in preview group');
      assert(dashedBox.geometry.attributes.position.count === 24, 'Dashed box has 24 vertices for 12 edges');
      assert(dashedBox.geometry.attributes.lineDistance.count === 24, 'Dashed box has computed lineDistance attribute');

      // 驗證琥珀金截面 (Shift / Termination Plane)
      const shiftPlane = mRenderer.cleavePreviewGroup.children.find(
        c => c instanceof THREE.Mesh && c.material && c.material.color && c.material.color.getHex() === 0xf59e0b
      );
      assert(shiftPlane !== undefined, 'Amber gold shift termination plane mesh found');
      const d111 = 5.43 / Math.sqrt(3);
      const expectedZ0 = 0.25 * d111;
      const p00_x = shiftPlane.geometry.attributes.position.getX(0);
      const p00_y = shiftPlane.geometry.attributes.position.getY(0);
      const p00_z = shiftPlane.geometry.attributes.position.getZ(0);
      const p00_dot_norm = (p00_x + p00_y + p00_z) / Math.sqrt(3);
      assertNear(p00_dot_norm, expectedZ0, 1e-3, 'Shift plane height along normal matches 0.25 * d_111');

      // 驗證表面外法向指示箭頭 (Normal Vector Arrow)
      const normArrow = mRenderer.cleavePreviewGroup.children.find(c => c instanceof THREE.ArrowHelper);
      assert(normArrow !== undefined, 'Normal vector ArrowHelper found in preview group');
      const idealNorm = new THREE.Vector3(1, 1, 1).normalize();
      const arrowDir = new THREE.Vector3(0, 1, 0).applyQuaternion(normArrow.quaternion);
      assertNear(arrowDir.dot(idealNorm), 1.0, 1e-4, 'Arrow strictly aligns with [1 1 1] plane normal');

      // 2. 測試平移滑桿動態調整至 0.75
      mRenderer.updateCleavePreview(siBulkPreview, {
        h: 1, k: 1, l: 1,
        layers: 3,
        shift: 0.75
      });
      const shiftPlane2 = mRenderer.cleavePreviewGroup.children.find(
        c => c instanceof THREE.Mesh && c.material && c.material.color && c.material.color.getHex() === 0xf59e0b
      );
      const p00_2_x = shiftPlane2.geometry.attributes.position.getX(0);
      const p00_2_y = shiftPlane2.geometry.attributes.position.getY(0);
      const p00_2_z = shiftPlane2.geometry.attributes.position.getZ(0);
      const p00_2_dot_norm = (p00_2_x + p00_2_y + p00_2_z) / Math.sqrt(3);
      assertNear(p00_2_dot_norm, 0.75 * d111, 1e-3, 'Shift plane dynamically slides to 0.75 * d_111');

      // 3. 測試切面層數擴展至 5 層
      mRenderer.updateCleavePreview(siBulkPreview, {
        h: 1, k: 1, l: 1,
        layers: 5,
        shift: 0.75
      });
      const topCap = mRenderer.cleavePreviewGroup.children.find(
        c => c instanceof THREE.Mesh && c.material && c.material.color && c.material.color.getHex() === 0x38bdf8
      );
      assert(topCap !== undefined, 'Top cap mesh found');
      const t00_x = topCap.geometry.attributes.position.getX(0);
      const t00_y = topCap.geometry.attributes.position.getY(0);
      const t00_z = topCap.geometry.attributes.position.getZ(0);
      const t00_dot_norm = (t00_x + t00_y + t00_z) / Math.sqrt(3);
      assertNear(t00_dot_norm, (0.75 + 5) * d111, 1e-3, 'Top plane height strictly reaches (shift + 5) * d_111');

      // 4. 測試無效輸入 (0 0 0) 自動隱藏
      mRenderer.updateCleavePreview(siBulkPreview, { h: 0, k: 0, l: 0 });
      assert(mRenderer.cleavePreviewGroup.children.length === 0, 'Invalid (0,0,0) index clears preview group');

      // 5. 測試 hideCleavePreview 乾淨移除
      mRenderer.updateCleavePreview(siBulkPreview, { h: 0, k: 0, l: 1, layers: 2, shift: 0.1 });
      assert(mRenderer.cleavePreviewGroup.children.length > 0, 'Re-populated preview group');
      mRenderer.hideCleavePreview();
      assert(mRenderer.cleavePreviewGroup.children.length === 0, 'hideCleavePreview completely clears preview group');

      log('=== 35. Single Atom Replacement (e.g. CH4: H -> F, H -> Cl, C -> Si) Test ===');
      // 1. 建立甲烷 CH4
      const ch4 = PRESETS.methane.build();
      assert(ch4.atoms.length === 5, 'Methane has 5 atoms initially');
      assert(ch4.getFormula() === 'C H4', 'Initial formula is C H4');

      // 2. 將其中一個 H 替換為 F (CH4 -> CH3F 氟甲烷)
      const hIdx1 = ch4.atoms.findIndex(a => a.element === 'H');
      assert(hIdx1 !== -1, 'Found H atom in CH4');
      const successF = VSEPR.replaceSingleAtom(ch4, hIdx1, 'F');
      assert(successF === true, 'replaceSingleAtom returned true for F');
      assert(ch4.atoms.length === 5, 'Atom count strictly remains 5 (no extra atoms added)');
      assert(ch4.atoms[hIdx1].element === 'F', 'Target atom element is now F');
      assert(ch4.getFormula() === 'C H3 F', 'Formula is now C H3 F (fluoromethane)');

      // 驗證 C-F 鍵長已自適應為理想共價鍵長 (~1.33-1.35 Å)
      const cIdx = ch4.atoms.findIndex(a => a.element === 'C');
      const dCF = Math.hypot(
        ch4.atoms[hIdx1].x - ch4.atoms[cIdx].x,
        ch4.atoms[hIdx1].y - ch4.atoms[cIdx].y,
        ch4.atoms[hIdx1].z - ch4.atoms[cIdx].z
      );
      assertNear(dCF, 1.33, 0.05, `C-F bond length adjusted to ideal (~1.33 Å, actual: ${dCF.toFixed(3)} Å)`);

      // 3. 連續將第二個 H 替換為 Cl (CH3F -> CH2ClF 氯氟甲烷)
      const hIdx2 = ch4.atoms.findIndex((a, i) => a.element === 'H' && i !== hIdx1);
      assert(hIdx2 !== -1, 'Found second H atom');
      VSEPR.replaceSingleAtom(ch4, hIdx2, 'Cl');
      assert(ch4.atoms.length === 5, 'Atom count remains 5');
      assert(ch4.getFormula() === 'C H2 Cl F', 'Formula is now C H2 Cl F (chlorofluoromethane)');
      const dCCl = Math.hypot(
        ch4.atoms[hIdx2].x - ch4.atoms[cIdx].x,
        ch4.atoms[hIdx2].y - ch4.atoms[cIdx].y,
        ch4.atoms[hIdx2].z - ch4.atoms[cIdx].z
      );
      assertNear(dCCl, 1.78, 0.05, `C-Cl bond length adjusted to ideal (~1.78 Å, actual: ${dCCl.toFixed(3)} Å)`);

      // 4. 將中心碳原子 C 替換為矽 Si (CH2ClF -> SiH2ClF)
      VSEPR.replaceSingleAtom(ch4, cIdx, 'Si');
      assert(ch4.atoms.length === 5, 'Atom count remains 5');
      assert(ch4.atoms[cIdx].element === 'Si', 'Central atom is now Si');
      assert(ch4.getFormula() === 'Cl F H2 Si', 'Formula is now Cl F H2 Si (alphabetical for non-carbon)');

      // 5. 測試週期表單一原子模式清單注入與筆刷互動
      const dummySingleAtomApp = {
        structure: PRESETS.methane.build(),
        controller: {
          activeElement: 'F',
          activeHybrid: 'single_atom',
          isBrushMode: true,
          brushElement: 'F',
          selectedSequence: [1],
          clearSelection: () => {}
        },
        renderer: { update: () => {} },
        pushHistory: () => {},
        updateUI: () => {},
        showToast: () => {}
      };
      VSEPR.replaceSingleAtom(dummySingleAtomApp.structure, 1, dummySingleAtomApp.controller.brushElement);
      assert(dummySingleAtomApp.structure.atoms[1].element === 'F', 'Brush replaced atom #2 with single atom F');
      assert(dummySingleAtomApp.structure.atoms.length === 5, 'Brush replacement kept atom count at 5');

      log('=== 36. Tinker XYZ vs Standard XYZ Format Discrimination Test ===');
      // 1. 標準 XYZ 格式（標準 .xyz 命名，第 1 行為原子數，第 2 行為註解，第 3 行起元素符號開頭）
      const standardXYZ = `3
Water Molecule Standard XYZ
O   0.000000  0.000000  0.117790
H   0.000000  0.755453 -0.471160
H   0.000000 -0.755453 -0.471160`;

      assert(Parsers.isStandardXYZ(standardXYZ) === true, 'isStandardXYZ correctly identifies standard XYZ');
      assert(Parsers.isTinkerXYZ(standardXYZ) === false, 'isTinkerXYZ correctly rejects standard XYZ');
      const parsedStd = Parsers.parse(standardXYZ, 'water.xyz');
      assert(parsedStd.atoms.length === 3, 'parse() via water.xyz parsed 3 atoms for standard XYZ');
      assert(parsedStd.atoms[0].element === 'O' && parsedStd.atoms[1].element === 'H', 'Standard XYZ elements parsed correctly');
      assert(parsedStd.bonds.length === 2, 'Standard XYZ auto-detected 2 O-H bonds');

      // 2. Tinker XYZ 分子格式（同為 .xyz 命名，第 1 行原子數+名稱，第 2 行起原子序號 1 2 3... + 元素 + 座標 + 類型 + 連鍵）
      const tinkerXYZ = ` 3  Water Tinker XYZ
     1  O       0.000000    0.000000    0.117790     1     2     3
     2  H       0.000000    0.755453   -0.471160     2     1
     3  H       0.000000   -0.755453   -0.471160     2     1`;

      assert(Parsers.isTinkerXYZ(tinkerXYZ) === true, 'isTinkerXYZ correctly identifies molecular Tinker XYZ');
      assert(Parsers.isStandardXYZ(tinkerXYZ) === false, 'isStandardXYZ correctly rejects Tinker XYZ');

      assert(parsedNebPdb.atoms[2].element === 'N', 'NEB PDB Atom 3 is N');
      assertNear(parsedNebPdb.atoms[2].z, 14.399, 1e-3, 'Frame 1 N z is 14.399');
      parsedNebPdb.setFrame(1);
      assertNear(parsedNebPdb.atoms[2].z, 14.800, 1e-3, 'Frame 2 N z switched to 14.800');

      const nebXyzSnippet = `4
Lattice="10.62597 0.0 0.0 -5.47944 9.10423 0.0 0.0 0.0 26.40071" Properties=species:S:1:pos:R:3 pbc="T T T"
Cu      -1.42620711       3.80959939       5.00000000
Ru      -0.02478951       1.51570255       5.00000000
N        0.02000000       3.00300000      14.39900000
N        0.00900000       3.00700000      13.26600000
4
Lattice="10.62597 0.0 0.0 -5.47944 9.10423 0.0 0.0 0.0 26.40071" Properties=species:S:1:pos:R:3 pbc="T T T"
Cu      -1.42620711       3.80959939       5.00000000
Ru      -0.02478951       1.51570255       5.00000000
N        0.04000000       3.05000000      14.80000000
N        0.01000000       3.01000000      13.10000000`;

      const parsedNebXyz = Parsers.parse(nebXyzSnippet, 'full_RuCu_dissociation_movie.xyz');
      assert(parsedNebXyz.atoms.length === 4, 'NEB XYZ parsed 4 atoms');
      assert(parsedNebXyz.getFrameCount() === 2, 'NEB XYZ parsed 2 frames');
      assert(parsedNebXyz.atoms[0].element === 'Cu', 'NEB XYZ Atom 1 is Cu');
      assert(parsedNebXyz.atoms[1].element === 'Ru', 'NEB XYZ Atom 2 is Ru');
      assert(parsedNebXyz.atoms[2].element === 'N', 'NEB XYZ Atom 3 is N');
      assertNear(parsedNebXyz.atoms[2].z, 14.399, 1e-3, 'Frame 1 N z is 14.399 in XYZ');
      parsedNebXyz.setFrame(1);
      assertNear(parsedNebXyz.atoms[2].z, 14.800, 1e-3, 'Frame 2 N z switched to 14.800 in XYZ');

      log('=== 46. MoleculeRenderer Periodic Cell Box (drawCellBox) Test ===');
      const testCellRenderer = new MoleculeRenderer(document.createElement('div'));
      testCellRenderer.showCellBox = true;
      testCellRenderer.update(parsedNebPdb);
      assert(testCellRenderer.cellLines !== null, 'drawCellBox created unit cell wireframe line segments without error');
      assert(testCellRenderer.atomMesh !== null, 'Atom instanced mesh created for periodic NEB structure');
      testCellRenderer.updateFramePositions(parsedNebPdb);
      assert(testCellRenderer.atomMesh.instanceMatrix.version > 0 || testCellRenderer.atomMesh.instanceMatrix.needsUpdate, 'updateFramePositions updated GPU instance matrix');

      log(`\n========================================`);
      log(`TEST SUMMARY: ${passed} PASSED, ${failed} FAILED`);
      log(`========================================`);

    } catch (e) {
      log(`TEST EXCEPTION: ${e.message}\n${e.stack}`);
    }
  </script>
